<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">SmartHealth architecture</title><desc id="d">MAX30102 and MLX90614 sensors feed a WeMos D1 ESP8266, which sends data over Wi-Fi to Firebase, synchronised in real time with a Flutter app that provides alerts and sign-in.</desc><defs><style>.t{font:600 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E0FBFC}.s{font:12px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9FB3C8}.h{font:600 13px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5BC0BE;letter-spacing:.6px}
