<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Multilingual RAG architecture</title><desc id="d">Offline ingestion, chunking, embedding and Chroma indexing; online FastAPI, LangChain retrieval, Mistral Large generation and Streamlit interface; RAGAS evaluation.</desc><defs><style>.t{font:600 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E0FBFC}.s{font:12px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9FB3C8}.h{font:600 13px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5BC0BE;letter-spacing:.6px}
