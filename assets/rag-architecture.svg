 y="380.0" text-anchor="middle">grounded generation</text><rect class="b" style="animation-delay:8.1s" x="805" y="333" width="150" height="64" rx="10"/><text class="t" x="880.0" y="362.0" text-anchor="middle">Streamlit</text><text class="s" x="880.0" y="380.0" text-anchor="middle">chat interface</text><rect class="b" style="animation-delay:9.0s" x="805" y="442" width="150" height="56" rx="10"/><text class="t" x="880.0" y="467.0" text-anchor="middle">RAGAS</text><text class="s" x="880.0" y="485.0" text-anchor="middle">automated metrics</text><text class="s" x="45" y="495">Architecture of the multilingual RAG assistant. Implementation details are in the repository.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>