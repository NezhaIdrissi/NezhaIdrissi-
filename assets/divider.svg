<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 20" width="1000" height="20" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Section divider</title><desc id="d">Decorative divider.</desc><defs><style>.t{font:600 15px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E0FBFC}.s{font:12px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#9FB3C8}.h{font:600 13px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5BC0BE;letter-spacing:.6px}
.b{fill:#1C2541;stroke:#3A506B;stroke-width:1.5;animation:glow 10s ease-in-out infinite}
@keyframes glow{0%,20%,100%{stroke:#3A506B}4%,12%{stroke:#5BC0BE}}
.l{stroke:#3A506B;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.w{animation:wf 1.6s ease-in-out infinite}@keyframes wf{0%,100%{opacity:.15}50%{opacity:1}}
.ecg{fill:none;stroke:#5BC0BE;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;animation:ecg 2.6s linear infinite}
@keyframes ecg{0%{stroke-dashoffset:300}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-300}}
